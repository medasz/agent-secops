<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-open" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polyline points="0 0, 10 3.5, 0 7" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', monospace; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Region: Local Service -->
  <rect x="30" y="60" width="580" height="520" rx="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="44" y="76" fill="#22d3ee" font-size="9" font-weight="600">AI-Connector Service (localhost:3001)</text>

  <!-- Region: External Providers -->
  <rect x="630" y="60" width="240" height="250" rx="12" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="644" y="76" fill="#fbbf24" font-size="9" font-weight="600">External AI Providers</text>

  <!-- ==================== LAYER 1: Clients ==================== -->
  <!-- Mask -->
  <rect x="50" y="100" width="160" height="80" rx="6" fill="#0f172a"/>
  <!-- Box -->
  <rect x="50" y="100" width="160" height="80" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="130" y="126" fill="white" font-size="11" font-weight="600" text-anchor="middle">HTTP Client</text>
  <text x="130" y="142" fill="#94a3b8" font-size="9" text-anchor="middle">OpenAI SDK / curl</text>
  <text x="130" y="158" fill="#94a3b8" font-size="9" text-anchor="middle">Custom App</text>

  <!-- ==================== LAYER 2: HTTP Server ==================== -->
  <!-- Mask -->
  <rect x="250" y="100" width="140" height="80" rx="6" fill="#0f172a"/>
  <!-- Box -->
  <rect x="250" y="100" width="140" height="80" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="320" y="126" fill="white" font-size="11" font-weight="600" text-anchor="middle">HTTP Server</text>
  <text x="320" y="142" fill="#94a3b8" font-size="9" text-anchor="middle">server.js</text>
  <text x="320" y="158" fill="#94a3b8" font-size="9" text-anchor="middle">:3001</text>

  <!-- Arrow: Client → Server -->
  <path d="M 210 140 L 248 140" fill="none" stroke="#22d3ee" marker-end="url(#arrow-cyan)"/>
  <text x="229" y="133" fill="#22d3ee" font-size="7" text-anchor="middle">POST /v1/chat/completions</text>

  <!-- ==================== LAYER 3: Middleware ==================== -->
  <!-- Rate Limiter -->
  <rect x="250" y="220" width="140" height="50" rx="6" fill="#0f172a"/>
  <rect x="250" y="220" width="140" height="50" rx="6" fill="rgba(251,146,60,0.2)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="320" y="240" fill="white" font-size="10" font-weight="600" text-anchor="middle">Rate Limiter</text>
  <text x="320" y="256" fill="#94a3b8" font-size="9" text-anchor="middle">middleware/rate-limit.js</text>

  <!-- Quota -->
  <rect x="250" y="285" width="140" height="50" rx="6" fill="#0f172a"/>
  <rect x="250" y="285" width="140" height="50" rx="6" fill="rgba(251,146,60,0.2)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="320" y="305" fill="white" font-size="10" font-weight="600" text-anchor="middle">Quota Manager</text>
  <text x="320" y="321" fill="#94a3b8" font-size="9" text-anchor="middle">middleware/quota.js</text>

  <!-- Arrow: Server → Rate Limiter -->
  <path d="M 320 180 L 320 218" fill="none" stroke="#22d3ee" marker-end="url(#arrow-cyan)"/>

  <!-- Arrow: Rate Limiter → Quota -->
  <path d="M 320 270 L 320 283" fill="none" stroke="#fb923c" marker-end="url(#arrow)"/>

  <!-- ==================== LAYER 4: Router ==================== -->
  <rect x="250" y="360" width="140" height="50" rx="6" fill="#0f172a"/>
  <rect x="250" y="360" width="140" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="320" y="380" fill="white" font-size="10" font-weight="600" text-anchor="middle">Router</text>
  <text x="320" y="396" fill="#94a3b8" font-size="9" text-anchor="middle">routes/index.js</text>

  <!-- Arrow: Quota → Router -->
  <path d="M 320 335 L 320 358" fill="none" stroke="#22d3ee" marker-end="url(#arrow-cyan)"/>

  <!-- ==================== LAYER 5: Route Handlers ==================== -->
  <!-- chat.js -->
  <rect x="250" y="435" width="140" height="50" rx="6" fill="#0f172a"/>
  <rect x="250" y="435" width="140" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="320" y="455" fill="white" font-size="10" font-weight="600" text-anchor="middle">chat.js</text>
  <text x="320" y="471" fill="#94a3b8" font-size="9" text-anchor="middle">POST /v1/chat/completions</text>

  <!-- models.js -->
  <rect x="50" y="435" width="120" height="50" rx="6" fill="#0f172a"/>
  <rect x="50" y="435" width="120" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="110" y="455" fill="white" font-size="10" font-weight="600" text-anchor="middle">models.js</text>
  <text x="110" y="471" fill="#94a3b8" font-size="9" text-anchor="middle">GET /v1/models</text>

  <!-- providers.js -->
  <rect x="180" y="435" width="55" height="50" rx="6" fill="#0f172a"/>
  <rect x="180" y="435" width="55" height="50" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="207" y="455" fill="white" font-size="10" font-weight="600" text-anchor="middle">providers.js</text>
  <text x="207" y="471" fill="#94a3b8" font-size="9" text-anchor="middle">GET /v1/providers</text>

  <!-- Arrow: Router → chat.js -->
  <path d="M 320 410 L 320 433" fill="none" stroke="#34d399" marker-end="url(#arrow-emerald)"/>

  <!-- Arrows: Router → models/providers (dashed - less common path) -->
  <path d="M 250 385 L 150 385 L 150 435" fill="none" stroke="#34d399" stroke-dasharray="4,3" marker-end="url(#arrow-emerald)"/>
  <path d="M 250 385 L 207 385 L 207 433" fill="none" stroke="#34d399" stroke-dasharray="4,3" marker-end="url(#arrow-emerald)"/>

  <!-- ==================== LAYER 6: Provider Manager ==================== -->
  <rect x="420" y="435" width="170" height="50" rx="6" fill="#0f172a"/>
  <rect x="420" y="435" width="170" height="50" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="505" y="455" fill="white" font-size="10" font-weight="600" text-anchor="middle">ProviderManager</text>
  <text x="505" y="471" fill="#94a3b8" font-size="9" text-anchor="middle">providers/manager.js</text>

  <!-- Arrow: chat.js → ProviderManager -->
  <path d="M 390 460 L 418 460" fill="none" stroke="#a78bfa" marker-end="url(#arrow-violet)"/>

  <!-- ==================== LAYER 7: Providers ==================== -->
  <!-- OpenAI Provider -->
  <rect x="430" y="515" width="70" height="45" rx="6" fill="#0f172a"/>
  <rect x="430" y="515" width="70" height="45" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="465" y="533" fill="white" font-size="9" font-weight="600" text-anchor="middle">OpenAI</text>
  <text x="465" y="547" fill="#94a3b8" font-size="7" text-anchor="middle">openai.js</text>

  <!-- Ollama Provider -->
  <rect x="510" y="515" width="70" height="45" rx="6" fill="#0f172a"/>
  <rect x="510" y="515" width="70" height="45" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="545" y="533" fill="white" font-size="9" font-weight="600" text-anchor="middle">Ollama</text>
  <text x="545" y="547" fill="#94a3b8" font-size="7" text-anchor="middle">ollama.js</text>

  <!-- Anthropic Provider -->
  <rect x="590" y="515" width="70" height="45" rx="6" fill="#0f172a"/>
  <rect x="590" y="515" width="70" height="45" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="625" y="533" fill="white" font-size="9" font-weight="600" text-anchor="middle">Anthropic</text>
  <text x="625" y="547" fill="#94a3b8" font-size="7" text-anchor="middle">anthropic.js</text>

  <!-- Arrow: ProviderManager → Providers -->
  <path d="M 505 485 L 505 513" fill="none" stroke="#a78bfa" marker-end="url(#arrow-violet)"/>
  <path d="M 545 485 L 545 513" fill="none" stroke="#a78bfa" marker-end="url(#arrow-violet)"/>
  <path d="M 585 485 L 585 513" fill="none" stroke="#a78bfa" marker-end="url(#arrow-violet)"/>

  <!-- ==================== LAYER 8: External APIs ==================== -->
  <!-- OpenAI API -->
  <rect x="648" y="95" width="210" height="65" rx="8" fill="#0f172a"/>
  <rect x="648" y="95" width="210" height="65" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="753" y="117" fill="white" font-size="11" font-weight="600" text-anchor="middle">api.openai.com</text>
  <text x="753" y="133" fill="#94a3b8" font-size="9" text-anchor="middle">/v1/chat/completions</text>
  <text x="753" y="149" fill="#94a3b8" font-size="9" text-anchor="middle">OpenAI GPT Models</text>

  <!-- Ollama Local -->
  <rect x="648" y="180" width="210" height="65" rx="8" fill="#0f172a"/>
  <rect x="648" y="180" width="210" height="65" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="753" y="202" fill="white" font-size="11" font-weight="600" text-anchor="middle">localhost:11434</text>
  <text x="753" y="218" fill="#94a3b8" font-size="9" text-anchor="middle">/api/chat</text>
  <text x="753" y="234" fill="#94a3b8" font-size="9" text-anchor="middle">Ollama Local Models</text>

  <!-- Anthropic API -->
  <rect x="648" y="265" width="210" height="65" rx="8" fill="#0f172a"/>
  <rect x="648" y="265" width="210" height="65" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="753" y="287" fill="white" font-size="11" font-weight="600" text-anchor="middle">api.anthropic.com</text>
  <text x="753" y="303" fill="#94a3b8" font-size="9" text-anchor="middle">/v1/messages</text>
  <text x="753" y="319" fill="#94a3b8" font-size="9" text-anchor="middle">Anthropic Claude Models</text>

  <!-- Arrows: Providers → External APIs -->
  <path d="M 465 560 L 465 580 L 648 580 L 648 160" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <path d="M 545 560 L 545 575 L 610 575 L 610 212" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <path d="M 625 560 L 753 560 L 753 330" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>

  <!-- ==================== Config ==================== -->
  <rect x="50" y="220" width="120" height="50" rx="6" fill="#0f172a"/>
  <rect x="50" y="220" width="120" height="50" rx="6" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="110" y="240" fill="#a78bfa" font-size="10" font-weight="600" text-anchor="middle">config/</text>
  <text x="110" y="256" fill="#94a3b8" font-size="9" text-anchor="middle">config.json + .env</text>

  <!-- Config → Server -->
  <path d="M 130 270 L 180 270 L 180 180 L 248 180" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-violet)"/>

  <!-- ==================== Legend ==================== -->
  <rect x="30" y="565" width="840" height="45" rx="8" fill="rgba(30,41,59,0.5)" stroke="#334155" stroke-width="1"/>
  <text x="50" y="582" fill="#94a3b8" font-size="8" font-weight="600">Legend</text>

  <rect x="50" y="590" width="12" height="12" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="68" y="600" fill="#94a3b8" font-size="8">Frontend / API / Input</text>

  <rect x="170" y="590" width="12" height="12" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="188" y="600" fill="#94a3b8" font-size="8">Route Handlers</text>

  <rect x="295" y="590" width="12" height="12" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="313" y="600" fill="#94a3b8" font-size="8">Provider System</text>

  <rect x="415" y="590" width="12" height="12" rx="2" fill="rgba(251,146,60,0.2)" stroke="#fb923c" stroke-width="1.5"/>
  <text x="433" y="600" fill="#94a3b8" font-size="8">Middleware</text>

  <rect x="525" y="590" width="12" height="12" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="543" y="600" fill="#94a3b8" font-size="8">External Provider</text>

  <rect x="680" y="590" width="12" height="12" rx="2" fill="rgba(76,29,149,0.3)" stroke="#a78bfa" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="698" y="600" fill="#94a3b8" font-size="8">Configuration</text>

  <!-- Title -->
  <text x="30" y="36" fill="#e2e8f0" font-size="14" font-weight="700">AI-Connector 架构图</text>
  <text x="30" y="52" fill="#64748b" font-size="10">OpenAI-Compatible Multi-Provider API Gateway</text>
</svg>