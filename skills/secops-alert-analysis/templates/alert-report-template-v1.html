<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
</head>
<body>
  <style>
    :root {
      --bg: #faf9f5;
      --surface: #ffffff;
      --border: #e8e6dc;
      --text: #141413;
      --text-muted: #b0aea5;
      --accent: #d97757;
      --accent-hover: #c4613f;
      --green: #788c5d;
      --red: #c44;
      --header-bg: #141413;
      --header-text: #faf9f5;
      --radius: 6px;
    }

    [data-theme="dark"] {
      --bg: #1a1a1a;
      --surface: #242424;
      --border: #3a3a3a;
      --text: #f0ede8;
      --text-muted: #888;
      --header-bg: #0a0a0a;
      --header-text: #f0ede8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .report-header {
      background: var(--header-bg);
      color: var(--header-text);
      padding: 1.5rem 2rem;
    }

    .report-header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .report-header .meta {
      font-size: 0.875rem;
      opacity: 0.8;
    }

    .report-header .meta span {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      margin-right: 1.5rem;
    }

    .report-header .meta svg {
      flex-shrink: 0;
    }

    .toolbar {
      position: fixed;
      top: 1rem;
      right: 1rem;
      display: flex;
      gap: 0.5rem;
      z-index: 100;
    }

    .toolbar button {
      font-size: 0.75rem;
      padding: 0.375rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      cursor: pointer;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
    }

    .toolbar button:hover {
      background: var(--bg);
    }

    .report-body {
      max-width: 1100px;
      margin: 0 auto;
      padding: 2rem;
    }

    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 1.5rem;
    }

    .section-header {
      padding: 0.75rem 1rem;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .section-body {
      padding: 1rem;
    }

    table {
      border-collapse: collapse;
      font-size: 0.875rem;
      width: 100%;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
      text-align: left;
    }

    th {
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--text-muted);
      background: var(--bg);
    }

    tr:hover {
      background: var(--bg);
    }

    .priority-p0 { color: var(--red); font-weight: 600; }
    .priority-p1 { color: #e67e22; font-weight: 600; }
    .priority-p2 { color: #f39c12; font-weight: 600; }
    .priority-p3 { color: var(--text-muted); }

    .badge {
      display: inline-block;
      padding: 0.125rem 0.5rem;
      border-radius: 9999px;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-success { background: #eef2e8; color: var(--green); }
    .badge-danger { background: #fceaea; color: var(--red); }
    .badge-warning { background: #fef3e2; color: #e67e22; }

    pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0.75rem 1rem;
      font-family: Consolas, 'Courier New', monospace;
      font-size: 0.8125rem;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    code {
      font-family: Consolas, 'Courier New', monospace;
      font-size: 0.875em;
      background: var(--bg);
      padding: 0.125rem 0.375rem;
      border-radius: 3px;
    }

    blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 1rem;
      color: var(--text-muted);
      font-style: italic;
      margin: 1rem 0;
    }

    ul, ol {
      padding-left: 1.5rem;
    }

    li {
      margin-bottom: 0.375rem;
    }

    .footer {
      text-align: center;
      padding: 2rem;
      color: var(--text-muted);
      font-size: 0.8125rem;
      border-top: 1px solid var(--border);
      margin-top: 2rem;
    }

    details {
      margin-bottom: 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    details > summary {
      padding: 0.75rem 1rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      user-select: none;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    details > summary .arrow {
      display: inline-block;
      width: 12px;
      height: 12px;
      transition: transform 0.2s;
    }

    details[open] > summary .arrow {
      transform: rotate(90deg);
    }

    details > table {
      margin: 0;
    }

    @media print {
      .toolbar { display: none; }
      body { background: white; }
      .section { break-inside: avoid; }
      details { display: block; }
      details > summary ~ * { display: block; }
    }

    @media (max-width: 768px) {
      .report-body { padding: 1rem; }
      table { font-size: 0.8125rem; }
      th, td { padding: 0.375rem 0.5rem; }
    }
  </style>

  <div class="toolbar">
    <button onclick="toggleTheme()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      切换主题
    </button>
    <button onclick="window.print()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      打印
    </button>
  </div>

  <header class="report-header">
    <h1>{{title}}</h1>
    <div class="meta">
      <span>
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        {{date_range}}
      </span>
      <span>
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        {{analyst}}
      </span>
      <span>
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
        {{report_time}}
      </span>
    </div>
  </header>

  <main class="report-body">
    {{content}}
  </main>

  <footer class="footer">
    <p>※ Powered by SecOps Agent Skill ※</p>
    <p>内容由 AI 生成，请核实关键细节</p>
  </footer>

  <script>
    function toggleTheme() {
      var html = document.documentElement;
      var current = html.getAttribute('data-theme');
      html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    }
  </script>
</body>
</html>
